<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOTO | Login</title>
  <!-- ALL design comes from style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== LOGIN CARD ===== -->
  <main class="login-card">

    <!-- Title -->
    <h1 class="brand-title">FOTO</h1>
    <p class="brand-subtitle">Capture Every Moment</p>

    <!-- Tabs -->
    <div class="tabs">
      <button type="button" class="tab-btn" data-target="journalist-panel">Photo Journalist</button>
      <button type="button" class="tab-btn active" data-target="student-panel">Student</button>
    </div>

    <!-- ===== STUDENT TAB (shown first): no password, just a button ===== -->
    <div class="form-panel active" id="student-panel">
      <div class="student-space"></div>
      <!-- PHP: put your Student gallery file name in href="" (example: gallery.php) -->
      <a class="btn-blue" href="">Enter Gallery</a>
    </div>

    <!-- ===== PHOTO JOURNALIST TAB ===== -->
    <!-- PHP: put your login file name in action="" (example: login.php) -->
    <form class="form-panel" id="journalist-panel" action="" method="POST">

      <!-- Username -->
      <div class="input-box">
        <input type="text" name="username" placeholder="Username" required>
      </div>

      <!-- Password (with show/hide eye) -->
      <div class="input-box">
        <input type="password" name="password" id="password" placeholder="Password" required>
        <button type="button" class="eye-btn" id="toggle-password" aria-label="Show or hide password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <!-- Forgot Password link (goes to forgot-password.html) -->
      <a class="forgot-link" href="forgot-password.html">Forgot Password</a>

      <!-- Login button -->
      <button type="submit" class="btn-blue">Login</button>

      <!-- Sign up link (goes to signup.html) -->
      <p class="signup-text">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="page-footer">
    FOTO • Capture Every Moment • College Departmental Photo Gallery<br>
    © 2026 FOTO. All rights reserved.
  </footer>

  <!-- ===== JAVASCRIPT: tab switching + show/hide password ===== -->
  <script>
    // Switch between tabs
    var tabButtons = document.querySelectorAll('.tab-btn');
    var panels = document.querySelectorAll('.form-panel');

    tabButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabButtons.forEach(function (b) { b.classList.remove('active'); });
        panels.forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    // Show / hide password
    var passwordInput = document.getElementById('password');
    document.getElementById('toggle-password').addEventListener('click', function () {
      passwordInput.type = (passwordInput.type === 'password') ? 'text' : 'password';
    });
  </script>

</body>
</html>
